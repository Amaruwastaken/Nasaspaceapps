
<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#061b3a" />
  <meta name="description" content="Iniciar sesión en Farmacias Similunares" />
  <title>Iniciar Sesión | Farmacias Similunares</title>
  <!-- Shared navigation styles/scripts; local styles tune the sign-in form. -->
  <link rel="stylesheet" href="Style.css" />
  <link rel="stylesheet" href="Forms.css" />
  <script src="Script.js" defer></script>
  <script type="module" src="auth.js"></script>
  <link rel="icon" type="image/png" href="Imagenes/farmacias-similunares.png" />
</head>
<body>
  <div class="app" id="app">

    <!-- Shared brand header and menu control. -->
    <header class="topbar">
      <a class="brand" href="Index.html" aria-label="Farmacias Similunares, ir al inicio">
        <img class="brand-mark" src="Imagenes/farmacias-similunares.png" width="44" height="44" alt="" aria-hidden="true" />
        <span>Farmacias Similunares<span class="brand-dot">.</span></span>
      </a>

      <div class="topbar-actions">
        <button class="menu-toggle" id="menuToggle" type="button"
          aria-controls="sidebar" aria-expanded="false"
          aria-label="Abrir menú">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <div class="shell">

      <main class="main" id="iniciar-sesion">

        <div class="intro">
          <span class="section-label">FARMACIAS SIMILUNARES</span>
          <h1>Iniciar Sesión</h1>
          <p>Ingresa a tu cuenta para continuar.</p>
        </div>

        <!-- Credentials are validated by the browser and submitted by auth.js. -->
        <section class="login-container">
          <form class="login-form" id="loginForm" method="post">
            <p id="authMessage" role="status" aria-live="polite"></p>

            <div class="form-group">
              <label for="correo">Correo electrónico</label>
              <input type="email" id="correo" name="correo"
                placeholder="ejemplo@correo.com"
                autocomplete="email" required />
            </div>

            <div class="form-group">
              <label for="contrasena">Contraseña</label>
              <input type="password" id="contrasena"
                name="contrasena" placeholder="Tu contraseña"
                autocomplete="current-password" required />
            </div>

            <button type="submit" class="login-button" disabled>
              Iniciar Sesión
            </button>

            <p class="register-text">
              ¿No tienes una cuenta?
              <a href="registro.html">Regístrate aquí</a>
            </p>

          </form>
        </section>

      </main>

      <!-- Shared drawer; its links change with the user's authentication state. -->
      <aside class="sidebar" id="sidebar"
        aria-label="Menú lateral" aria-hidden="true" inert>

        <div class="sidebar-top">
          <div class="sidebar-heading">NAVEGACIÓN</div>
          <button class="sidebar-close" type="button"
            id="sidebarClose" aria-label="Cerrar menú">×</button>
        </div>

        <nav class="sidebar-nav" aria-label="Navegación principal">

          <a href="Index.html" class="nav-link">
            <span class="nav-icon">⌂</span>
            <span>Inicio</span>
          </a>

          <a href="mision.html" class="nav-link">
            <span class="nav-icon">01</span>
            <span>Mision</span>
          </a>

           <a href="reporte.html" class="nav-link">
            <span class="nav-icon">02</span>
            <span>Reporte</span>
          </a>
          <a href="captura.html" class="nav-link"><span class="nav-icon">03</span><span>Captura</span></a>


          <div class="nav-divider"></div>
          <span class="sidebar-label">PERFIL</span>

          <a href="registro.html" class="nav-link" data-auth="logged-out"><span class="nav-icon">⌨</span><span>Registro</span></a>
          <a href="login.html" class="nav-link is-active" data-auth="logged-out" aria-current="page"><span class="nav-icon">➔</span><span>Iniciar Sesión</span></a>
          <button type="button" class="nav-link" id="logoutButton" data-auth="logged-in" hidden>
            <span class="nav-icon">↪</span><span>Cerrar Sesión</span>
          </button>

        </nav>

        <div class="sidebar-footer">
          <div class="sidebar-user" data-auth="logged-in" hidden>
            <svg class="sidebar-user-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21a8 8 0 0 1 16 0"></path>
            </svg>
            <span id="sidebarUserName">Usuario</span>
          </div>
          <span class="sidebar-copyright">Farmacias Similunares 2026</span>
        </div>

      </aside>
    </div>

    <!-- Click target for closing the open drawer. -->
    <div class="overlay" id="overlay" aria-hidden="true"></div>

  </div>
</body>
</html>
