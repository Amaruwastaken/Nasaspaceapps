
<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f8fc" />
  <meta name="description" content="Reporte de Farmacias Similunares" />
  <title>Reporte | Farmacias Similunares</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Farmacias Similunares, ir al inicio">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Farmacias Similunares<span class="brand-dot">.</span></span>
      </a>

      <div class="topbar-actions">
        <button class="menu-toggle" id="menuToggle" type="button"
          aria-controls="sidebar" aria-expanded="false"
          aria-label="Abrir menú">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <div class="shell">
      <main class="main" id="reporte">
        <div class="intro">
          <span class="section-label">FARMACIAS SIMILUNARES</span>
          <h1>Reporte</h1>
          <p>Consulta la información de nuestros reportes.</p>
        </div>

        <section class="report-content">
         <section class="report-content">
  <div class="organ-card missions" id="misiones">
    <div class="organ-card-header">
      <div>
        <span class="section-label">MISIONES</span>
        <h2>Planea tu viaje</h2>
      </div>
      <span class="card-chip" id="missionsChip">Paso 1 de 3</span>
    </div>

    <p class="missions-hint" id="missionsHint">Toca tu punto de partida (A).</p>

    <div class="trip">
      <div class="trip-slot"><span>A · PARTIDA</span><strong id="slotAName">—</strong></div>
      <span class="trip-arrow">➔</span>
      <div class="trip-slot"><span>B · DESTINO</span><strong id="slotBName">—</strong></div>
    </div>

    <div class="space" id="planets">
      <div class="space-line" aria-hidden="true"></div>
      <button class="planet earth" type="button" data-planet="tierra" aria-label="Tierra">🌍<small>Tierra</small></button>
      <button class="planet moon" type="button" data-planet="luna" aria-label="Luna">🌙<small>Luna</small></button>
      <button class="planet mars" type="button" data-planet="marte" aria-label="Marte">🔴<small>Marte</small></button>
    </div>

    <div class="mission-form" id="missionForm" hidden>
      <label class="field">
        <span>Días de viaje (días terrestres)</span>
        <input type="number" id="travelDays" min="0" step="any" inputmode="decimal" placeholder="Ej. 3.5">
      </label>
      <label class="field">
        <span>Días de estancia en <b id="stayPlace">B</b> (días terrestres)</span>
        <input type="number" id="stayDays" min="0" step="any" inputmode="decimal" placeholder="Ej. 10.25">
      </label>
    </div>

    <div class="route" id="route" aria-live="polite" hidden></div>
    <button class="reset-btn" id="missionsReset" type="button" hidden>↺ Reiniciar</button>
  </div>
</section>
        </section>
      </main>

      <aside class="sidebar" id="sidebar"
        aria-label="Menú lateral" aria-hidden="true" inert>

        <div class="sidebar-top">
          <div class="sidebar-heading">NAVEGACIÓN</div>
          <button class="sidebar-close" type="button"
            id="sidebarClose" aria-label="Cerrar menú">×</button>
        </div>

        <nav class="sidebar-nav" aria-label="Navegación principal">
          <a href="Index.html" class="nav-link">
            <span class="nav-icon">⌂</span>
            <span>Inicio</span>
          </a>

          <a href="reporte.html" class="nav-link is-active" aria-current="page">
            <span class="nav-icon">01</span>
            <span>Mision</span>
          </a>

          <div class="nav-divider"></div>
          <span class="sidebar-label">PERFIL</span>

          <a href="registro.html" class="nav-link"><span class="nav-icon">⌨</span><span>Registro</span></a>
          <a href="login.html" class="nav-link"><span class="nav-icon">➔</span><span>Iniciar Sesion</span></a>

        <div class="sidebar-footer">Farmacias Similunares © 2026</div>
      </aside>
    </div>

    <div class="overlay" id="overlay" aria-hidden="true"></div>
  </div>
</body>
</html>
