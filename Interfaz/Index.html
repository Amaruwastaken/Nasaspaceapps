<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f8fc" />
  <meta name="description" content="Explora el universo!" />
  <title>Farmacias Similunares | Explora el universo!</title>
  <link rel="stylesheet" href="Style.css" />
  <script src="Script.js" defer></script>
  <script type="module" src="auth.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <a class="brand" href="#inicio" aria-label="Farmacias Similunares, ir al inicio">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Farmacias Similunares<span class="brand-dot">.</span></span>
      </a>
      <div class="topbar-actions">
        <button class="menu-toggle" id="menuToggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menú">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <div class="shell">
      <main class="main" id="inicio">
        <div class="intro">
          <span class="section-label">BIENVENIDO A FARMACIAS SIMILUNARES</span>
          <h1>Descubre sobre nuestra misión.</h1>
        </div>
      </main>

      <aside class="sidebar" id="sidebar" aria-label="Menú lateral" aria-hidden="true" inert>
        <div class="sidebar-top">
          <div class="sidebar-heading">NAVEGACIÓN</div>
          <button class="sidebar-close" type="button" id="sidebarClose" aria-label="Cerrar menú">×</button>
        </div>
     
          <nav class="sidebar-nav" aria-label="Navegación principal">

            <a href="Index.html" class="nav-link">
              <span class="nav-icon">⌂</span>
              <span>Inicio</span>
            </a>

            <!-- CON SESIÓN INICIADA -->
            <a href="reporte.html" class="nav-link"
              data-auth="logged-in" hidden>
              <span class="nav-icon">01</span>
              <span>Reporte</span>
            </a>

            <a href="registro.html" class="nav-link"
              data-auth="logged-out">
              <span class="nav-icon">⌨</span>
              <span>Registro</span>
            </a>

            <div class="nav-divider"></div>
            <span class="sidebar-label">PERFIL</span>

            <!-- SIN INICIAR SESIÓN -->
            <a href="login.html" class="nav-link"
              data-auth="logged-out">
              <span class="nav-icon">➔</span>
              <span>Iniciar Sesión</span>
            </a>

            <!-- CON SESIÓN INICIADA -->
            <button type="button" class="nav-link"
                    id="logoutButton" data-auth="logged-in" hidden>
              <span class="nav-icon">↪</span>
              <span>Cerrar Sesión</span>
            </button>

          </nav>

        <div class="sidebar-footer">
          <div class="sidebar-user" data-auth="logged-in" hidden>
            <svg class="sidebar-user-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21a8 8 0 0 1 16 0"></path>
            </svg>
            <span id="sidebarUserName">Usuario</span>
          </div>
          <span class="sidebar-copyright">Farmacias Similunares © 2026</span>
        </div>
      </aside>
    </div>
    <div class="overlay" id="overlay" aria-hidden="true"></div>
  </div>
</body>
</html>
