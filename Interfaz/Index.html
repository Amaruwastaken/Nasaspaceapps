<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f8fc" />
  <meta name="description" content="Explora el universo!" />
  <title>Farmacias Similunares | Explora el universo!</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <a class="brand" href="#inicio" aria-label="Farmacias Similunares, ir al inicio">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Farmacias Similunares<span class="brand-dot">.</span></span>
      </a>
      <div class="topbar-actions">
        <button class="topbar-button" type="button" id="LogInButton" aria-label="Iniciar Sesion">Inicar Sesión</button>
        <button class="menu-toggle" id="menuToggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menú">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <div class="shell">
      <main class="main" id="inicio">
        <div class="intro">
          <span class="section-label">BIENVENIDO A FARMACIAS SIMILUNARES</span>
          <h1>Descubre sobre nuestra misión.</h1>
        </div>

      <aside class="sidebar" id="sidebar" aria-label="Menú lateral" aria-hidden="true" inert>
        <div class="sidebar-top">
          <div class="sidebar-heading">NAVEGACIÓN</div>
          <button class="sidebar-close" type="button" id="sidebarClose" aria-label="Cerrar menú">×</button>
        </div>
        <nav class="sidebar-nav" aria-label="Navegación principal">
          <a href="#inicio" class="nav-link is-active"><span class="nav-icon">⌂</span><span>Inicio</span></a>
          <a href="#organ-heading" class="nav-link"><span class="nav-icon">◉</span><span>Órganos</span></a>
          <button class="nav-link" type="button" id="aboutButton"><span class="nav-icon">ⓘ</span><span>Acerca del proyecto</span></button>

          <span class="sidebar-label">EXPLORAR</span>
          <button class="nav-link" type="button" data-select="cerebro"><span class="nav-icon">01</span><span>Cerebro</span></button>
          <button class="nav-link" type="button" data-select="corazon"><span class="nav-icon">02</span><span>Corazón</span></button>
          <button class="nav-link" type="button" data-select="pulmones"><span class="nav-icon">03</span><span>Pulmones</span></button>
        </nav>
        <div class="sidebar-footer">Farmacias Similunares © 2026</div>
      </aside>
    </div>
    <div class="overlay" id="overlay" aria-hidden="true"></div>
  </div>
